<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site_name}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta name="twitter:card" content="summary">
  <style>body{font:17px/1.6 system-ui,sans-serif;max-width:920px;margin:auto;padding:24px;color:#16283a;background:#f7fafc}header,footer{border-bottom:1px solid #cbd5e1;padding:12px 0}footer{border-top:1px solid #cbd5e1;border-bottom:0;margin-top:40px}a{color:#075e91}main{padding:20px 0}h1{line-height:1.2}article{background:white;padding:18px;margin:12px 0;border:1px solid #dce5ed;border-radius:10px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #cbd5e1;text-align:left}.note{color:#526477}</style>
  {{schema}}
</head>
<body>
  <header><strong><a href="/">{{site_name}}</a></strong> · <a href="/compare/">Compare providers</a></header>
  <main>{{body}}</main>
  <footer>Offers are published only when a public official source can be checked. Prices and dates are omitted when unavailable. Always confirm terms at the official site.</footer>
</body>
</html>
